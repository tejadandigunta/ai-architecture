<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Learning Resources</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    p.subtitle {
      margin: 0 0 32px;
      color: #6b7280;
      font-size: 16px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 12px;
    }

    a {
      display: block;
      padding: 16px 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      color: #1d4ed8;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    a:hover {
      border-color: #1d4ed8;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.12);
    }

    a:focus-visible {
      outline: 2px solid #1d4ed8;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Learning Resources</h1>
    <p class="subtitle">A curated list of videos for your AI learning journey.</p>

    <ul>
      <li>
        <a href="https://www.youtube.com/watch?v=96jN2OCOfLs&t=2s" target="_blank" rel="noopener noreferrer">Andrej Karpathy: From Vibe Coding to Agentic Engineering w/ Stephanie Zhan
        </a>
      </li>
      <li>
        <a href="https://www.youtube.com/watch?v=UNzCG3lw6O0&t=1s">Building Great Agent Skills: The Missing Manual
        </a>
      </li>
      <li>
        <a href="https://www.youtube.com/watch?v=qyPCVqFUyDo&t=5s" target="_blank" rel="noopener noreferrer">Boris Cherny: We Cut 80% of Claude Code’s Prompt
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
